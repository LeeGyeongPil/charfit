[project]
name = "charfit-dev"
version = "0.1.0"
description = "Development environment for the charfit agent skill (tests only; the skill script has no dependencies)."
requires-python = ">=3.9"
license = { text = "MIT" }
dependencies = []

[dependency-groups]
dev = ["pytest>=8"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
